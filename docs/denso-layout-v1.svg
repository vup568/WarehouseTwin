<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc">
  <title id="title">Denso TLIP warehouse layout v1 - operational flows</title>
  <desc id="desc">Top-down proposal: three independent inbound cells on the east, two-stage outbound on the west, storage, customs fence, and segregated forklift, AGV and AMR routes.</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M 50 0 L 0 0 0 50" fill="none" stroke="#d8dee9" stroke-width="1"/></pattern>
    <marker id="arrow-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker>
    <marker id="arrow-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#ea580c"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172033; }
      .title { font-size: 20px; font-weight: 700; }.label { font-size: 15px; font-weight: 700; }.small { font-size: 11px; }
      .zone { stroke-width: 2; }.rack { fill: #9aa9bc; stroke: #334155; stroke-width: 1.5; }.rack-fast { fill: #7aa2d6; }
      .flow { fill: none; stroke-linecap: round; stroke-linejoin: round; }.barrier { fill: none; stroke: #475569; stroke-width: 4; stroke-dasharray: 9 5; }
    </style>
  </defs>
  <rect width="1100" height="900" fill="#f7f8fa"/><rect width="1100" height="900" fill="url(#grid)"/><rect x="4" y="4" width="1092" height="892" fill="none" stroke="#111827" stroke-width="8"/>
  <text class="title" x="22" y="34">DENSO TLIP — V1 OPERATIONAL LAYOUT (draft for approval)</text>
  <rect class="zone" x="270" y="220" width="530" height="520" fill="#dbeafe" fill-opacity=".5" stroke="#2563eb"/><text class="label" x="290" y="246">MAIN STORAGE · double racks</text>
  <g aria-label="16 double racks">
    <rect class="rack" x="300" y="680" width="220" height="20"/><rect class="rack" x="550" y="680" width="220" height="20"/><rect class="rack" x="300" y="625" width="220" height="20"/><rect class="rack" x="550" y="625" width="220" height="20"/>
    <rect class="rack rack-fast" x="300" y="570" width="220" height="20"/><rect class="rack rack-fast" x="550" y="570" width="220" height="20"/><rect class="rack rack-fast" x="300" y="515" width="220" height="20"/><rect class="rack rack-fast" x="550" y="515" width="220" height="20"/>
    <rect class="rack rack-fast" x="300" y="460" width="220" height="20"/><rect class="rack rack-fast" x="550" y="460" width="220" height="20"/><rect class="rack rack-fast" x="300" y="405" width="220" height="20"/><rect class="rack rack-fast" x="550" y="405" width="220" height="20"/>
    <rect class="rack" x="300" y="350" width="220" height="20"/><rect class="rack" x="550" y="350" width="220" height="20"/><rect class="rack" x="300" y="295" width="220" height="20"/><rect class="rack" x="550" y="295" width="220" height="20"/>
  </g>
  <rect class="zone" x="250" y="55" width="550" height="105" fill="#bbf7d0" fill-opacity=".8" stroke="#15803d"/><text class="label" x="430" y="88">DOMESTIC / VAT</text><rect x="250" y="160" width="550" height="5" fill="#dc2626"/><text class="small" x="430" y="153">FIXED CUSTOMS FENCE + 24/7 CAMERA</text><circle cx="525" cy="157" r="8" fill="#111827"/>
  <rect class="zone" x="250" y="165" width="550" height="575" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="12 8"/><text class="small" x="260" y="184">INTERNATIONAL / NON-VAT</text>
  <rect class="zone" x="15" y="235" width="220" height="505" fill="#f7d7b5" fill-opacity=".72" stroke="#c2410c"/><text class="label" x="35" y="264">OUTBOUND / LOADING</text><rect class="zone" x="35" y="330" width="170" height="65" fill="#fecaca" stroke="#b91c1c"/><text class="small" x="52" y="358">OUTBOUND QC CONVEYOR</text><rect class="zone" x="35" y="435" width="170" height="90" fill="#fed7aa" stroke="#c2410c"/><text class="small" x="50" y="468">DISPATCH STAGING</text><text class="small" x="50" y="483">to internal warehouse</text><rect x="50" y="735" width="130" height="75" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/><text class="small" x="70" y="766">OUTBOUND GATE</text>
  <text class="label" x="842" y="65">INBOUND / EAST</text>
  <g aria-label="Truck inbound cell one"><rect class="zone" x="835" y="92" width="245" height="122" fill="#fff1a8" fill-opacity=".75" stroke="#ca8a04"/><text class="small" x="850" y="112">TRUCK INBOUND CELL 01</text><text class="small" x="850" y="128">staging → inspection → conveyor → staging 2</text><rect x="1010" y="105" width="70" height="35" fill="#86efac" stroke="#166534"/><text class="small" x="1018" y="127">TRUCK 1</text><rect x="935" y="150" width="55" height="38" fill="#fde68a"/><rect x="870" y="150" width="48" height="38" fill="#fecaca"/><rect x="810" y="150" width="45" height="38" fill="#374151"/><rect x="755" y="150" width="45" height="38" fill="#fed7aa"/></g>
  <g aria-label="Truck inbound cell two"><rect class="zone" x="835" y="245" width="245" height="122" fill="#fff1a8" fill-opacity=".75" stroke="#ca8a04"/><text class="small" x="850" y="265">TRUCK INBOUND CELL 02</text><text class="small" x="850" y="281">staging → inspection → conveyor → staging 2</text><rect x="1010" y="258" width="70" height="35" fill="#86efac" stroke="#166534"/><text class="small" x="1018" y="280">TRUCK 2</text><rect x="935" y="303" width="55" height="38" fill="#fde68a"/><rect x="870" y="303" width="48" height="38" fill="#fecaca"/><rect x="810" y="303" width="45" height="38" fill="#374151"/><rect x="755" y="303" width="45" height="38" fill="#fed7aa"/></g>
  <g aria-label="Container inbound cell"><rect class="zone" x="835" y="570" width="245" height="122" fill="#fff1a8" fill-opacity=".75" stroke="#ca8a04"/><text class="small" x="850" y="590">CONTAINER INBOUND CELL</text><text class="small" x="850" y="606">staging → inspection → conveyor → staging 2</text><rect x="1010" y="583" width="70" height="35" fill="#86efac" stroke="#166534"/><text class="small" x="1014" y="605">CONTAINER</text><rect x="935" y="628" width="55" height="38" fill="#fde68a"/><rect x="870" y="628" width="48" height="38" fill="#fecaca"/><rect x="810" y="628" width="45" height="38" fill="#374151"/><rect x="755" y="628" width="45" height="38" fill="#fed7aa"/></g>
  <text class="small" x="838" y="715">yellow = staging · red = inspection · black = conveyor · orange = staging 2</text>
  <rect class="barrier" x="245" y="205" width="575" height="550"/><text class="small" x="410" y="773">FORKLIFT WORK CELL BARRIER · one forklift per zone</text>
  <polyline class="flow" points="755,169 720,169 700,260" stroke="#2563eb" stroke-width="15" marker-end="url(#arrow-in)"/><polyline class="flow" points="755,322 720,322 700,350" stroke="#2563eb" stroke-width="15" marker-end="url(#arrow-in)"/><polyline class="flow" points="755,647 720,647 700,590" stroke="#2563eb" stroke-width="15" marker-end="url(#arrow-in)"/>
  <polyline class="flow" points="700,500 245,500 210,360" stroke="#ea580c" stroke-width="15" marker-end="url(#arrow-out)"/><polyline class="flow" points="120,395 120,435" stroke="#ea580c" stroke-width="15" marker-end="url(#arrow-out)"/><polyline class="flow" points="120,525 115,735" stroke="#ea580c" stroke-width="15" marker-end="url(#arrow-out)"/>
  <polyline class="flow" points="790,785 790,210 270,210" stroke="#2563eb" stroke-width="10" stroke-dasharray="16 8"/><text class="small" x="545" y="202">AGV line — fenced, dedicated</text><polyline class="flow" points="275,785 275,735 275,260 790,260" stroke="#16a34a" stroke-width="10" stroke-dasharray="16 8"/><text class="small" x="450" y="284">AMR map lane — fenced, dedicated</text><rect class="barrier" x="260" y="790" width="540" height="30"/><text class="small" x="445" y="844">vehicle separation barriers</text>
  <g transform="translate(18 80)"><rect width="210" height="115" fill="#fff" fill-opacity=".92" stroke="#64748b"/><text class="small" x="12" y="23">V1 changes</text><text class="small" x="12" y="45">3 independent inbound cells</text><text class="small" x="12" y="64">2 truck gates (north-east)</text><text class="small" x="12" y="83">1 container gate (south-east)</text><text class="small" x="12" y="102">outbound: storage → QC → staging → internal</text></g>
</svg>
